<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14161a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Street Photography Heatmap</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<style>
  :root { --bg:#14161a; --panel:#1d2026; --text:#e8e6e1; --muted:#9a978f; --accent:#f5a623; --fav:#e05c5c; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); display:flex; height:100vh; height:100dvh; }
  #sidebar { width:340px; min-width:280px; overflow-y:auto; background:var(--panel); padding:16px; border-right:1px solid #2c2f36; }
  #map { flex:1; }
  .cityrow { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--muted); margin:0 0 8px; }
  h1 { font-size:18px; margin:0 0 4px; }
  #city, #area { font:12px -apple-system, "Segoe UI", sans-serif; color:var(--text); background:#23262d; border:1px solid #2c2f36; border-radius:6px; padding:2px 6px; height:22px; cursor:pointer; }
  .sub { font-size:12px; color:var(--muted); margin-bottom:12px; line-height:1.5; }
  .sub a { color:var(--accent); }
  .legend { font-size:12px; color:var(--muted); margin-bottom:12px; }
  .legend .li { display:contents; }   /* only the phone layout needs these spans; here they add no box */
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:4px; vertical-align:middle; }
  .spot { padding:8px 10px; border-radius:8px; margin-bottom:6px; cursor:pointer; background:#23262d; }
  .spot:hover { background:#2b2f38; }
  .spot .name { font-weight:600; font-size:13px; }
  .spot .count { color:var(--accent); font-size:12px; }
  .spot .whos { color:var(--muted); font-size:11px; margin-top:2px; }
  .popup { font-size:13px; max-width:260px; }
  .popup h3 { margin:0 0 6px; font-size:14px; }
  .popup .m { margin:6px 0; padding:6px 8px; border-left:3px solid var(--accent); background:#f4f2ee; }
  .popup .m.fav { border-left-color:var(--fav); }
  .popup .m.wt { border-left-color:#2d7dd2; }
  .pin-tag { font-size:10px; font-weight:600; color:#c8102e; border:1px solid #c8102e; border-radius:3px; padding:0 4px; margin-left:6px; vertical-align:middle; }
  .spot .name .pin-glyph { display:inline-block; width:9px; height:9px; border-radius:50%; background:#c8102e; border:2px solid #fff; margin-right:5px; vertical-align:middle; }
  .popup .m .w { font-weight:600; }
  .popup .m .n { color:#555; }
  .popup a { color:#0a66c2; font-size:12px; }
  .leaflet-popup-content-wrapper { border-radius:8px; }
  .dimmed-tiles { filter: grayscale(60%) brightness(80%); }
  /* Cluster bubbles (Leaflet.markercluster). Only the plugin's animation CSS is
     loaded, not its green/yellow Default.css, so the look here is the whole style. */
  .cluster { display:flex; align-items:center; justify-content:center; border-radius:50%; background:var(--panel); border:2px solid var(--accent); color:#fff; font-weight:600; font-size:12px; box-shadow:0 1px 4px rgba(0,0,0,.45); }
  .cluster-m { font-size:13px; }
  .cluster-l { font-size:14px; }
  /* Filter chips: pressed = on (solid border in the chip's color), unpressed = off (dim, dashed). */
  .filters { margin-bottom:12px; }
  .chips { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:6px; }
  .chip { font:11px -apple-system, "Segoe UI", sans-serif; color:var(--text); background:#23262d; border:1px solid var(--chip, var(--accent)); border-radius:999px; padding:3px 9px; cursor:pointer; }
  .chip:hover { background:#2b2f38; }
  .chip[aria-pressed="false"] { color:var(--muted); background:transparent; border:1px dashed #3a3e47; }
  .filtmeta { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); }
  .filtmeta a { color:var(--accent); text-decoration:none; }
  /* ---- Phone (under 700px wide): the map fills the screen and the sidebar
     becomes a bottom sheet with three stops (collapsed / half / full). The
     handle drags between them; a tap on it steps to the next one. Everything
     in the media query is scoped to phones, so the desktop layout above is
     untouched. ---- */
  .handle { display:none; }
  @media (max-width: 699px) {
    #sidebar {
      position:fixed; left:0; right:0; bottom:0; z-index:1100;   /* above Leaflet's controls (1000) */
      width:auto; min-width:0; padding:0 16px;
      border-right:0; border-top:1px solid #2c2f36; border-radius:14px 14px 0 0;
      box-shadow:0 -4px 16px rgba(0,0,0,.4); overscroll-behavior:contain;
      /* A grid puts the title and the city select on one row and the chips
         straight under them, ahead of the intro and legend, without moving
         any markup. */
      display:grid; grid-template-columns:minmax(0, 1fr) auto; column-gap:10px; align-content:start;
      grid-template-areas:"handle handle" "title city" "filters filters" "sub sub" "legend legend" "list list";
      transition:height .25s ease;
    }
    #sidebar[data-sheet="collapsed"] { height:120px; overflow:hidden; }
    #sidebar[data-sheet="half"] { height:50vh; height:50dvh; }
    #sidebar[data-sheet="full"] { height:calc(100vh - 48px); height:calc(100dvh - 48px); }
    #sidebar.dragging { transition:none; }
    @media (prefers-reduced-motion: reduce) { #sidebar { transition:none; } }
    .handle { display:block; grid-area:handle; position:sticky; top:0; z-index:1; padding:7px 0 5px; background:var(--panel); border:0; cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none; }
    .handle::before { content:""; display:block; width:36px; height:4px; border-radius:2px; background:#4a4e58; margin:0 auto; }
    h1 { grid-area:title; align-self:center; margin:0; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;   /* one line; fits down to 375px, trimmed with … below that */
         cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none; }   /* the title drags the sheet too */
    .cityrow { grid-area:city; margin:0; }
    .cityrow .lbl { display:none; }   /* the select reads "New York" on its own; the title needs the room */
    #city { height:28px; font-size:16px; }   /* 16px: below that iOS Safari zooms the page when a control is tapped */
    .filters { grid-area:filters; margin:2px 0 0; }
    /* One finger-scrollable strip of chips; it bleeds into the sheet's side
       padding so chips can slide right up to the edge. */
    .chiprows { display:flex; gap:10px; overflow-x:auto; scrollbar-width:none; margin:0 -16px; padding:0 16px; }
    .chiprows::-webkit-scrollbar { display:none; }
    .chips { flex:none; flex-wrap:nowrap; gap:6px; margin:0; }
    .chip { min-height:44px; padding:0 14px; font-size:13px; }
    #area { height:44px; font-size:16px; border-radius:22px; padding:0 12px; }
    .filtmeta { align-items:center; min-height:26px; font-size:12px; }
    .filtmeta a { display:flex; align-items:center; align-self:stretch; padding-left:16px; }   /* the whole row height is tappable */
    .sub { grid-area:sub; margin:10px 0 0; }
    .legend { grid-area:legend; margin:10px 0 0; }
    .legend .li { display:inline-block; white-space:nowrap; }   /* lines break between items, never between a dot and its label */
    #list { grid-area:list; margin-top:10px; }
    .spot { min-height:44px; padding:10px 12px; }
    .popup { max-width:min(260px, calc(85vw - 48px)); }   /* 48px = Leaflet's own popup margins and padding */
    .leaflet-popup-content { max-height:55vh; max-height:55dvh; overflow:auto; }   /* a spot with many mentions scrolls inside its popup */
    .leaflet-bottom.leaflet-right { top:0; bottom:auto; }   /* map credit moves up: the sheet would cover it */
  }
</style>
</head>
<body>
<div id="sidebar">
  <button type="button" class="handle" id="handle" aria-label="Resize the panel"></button>
  <div class="cityrow"><span class="lbl">City</span> <select id="city" title="Switch city"></select></div>
  <h1 id="title"></h1>
  <div class="sub" id="intro"></div>
  <!-- Each legend item is wrapped in a .li span so the phone can keep a dot with its
       label. The span closes just before the next item on purpose: splitting a text
       node any other way shifted a few glyphs by a sub-pixel on desktop. -->
  <div class="legend">
    <span class="li"><span class="dot" style="background:var(--accent)"></span>recommended for visitors&nbsp;&nbsp;
    </span><span class="li"><span class="dot" style="background:var(--fav)"></span>photographer's own favorite</span><br>
    <span class="li"><span class="dot" style="background:rgba(245,166,35,.45); border:1.5px solid var(--accent); border-radius:2px"></span>neighborhood / park area&nbsp;&nbsp;
    </span><span class="li"><span class="dot" style="background:var(--accent); width:14px; height:4px; border-radius:2px"></span>street / waterfront corridor&nbsp;&nbsp;
    </span><span class="li"><span class="dot" style="background:#c8102e; border:2px solid #fff; width:11px; height:11px"></span>exact spot someone named</span><br>
    <span style="color:var(--muted)">darker = more mentions</span>
  </div>
  <div class="filters">
    <div class="chiprows">
      <div class="chips" id="kindChips" title="Kinds of spot to show"></div>
      <div class="chips" id="typeChips" title="Kinds of mention to count"></div>
      <div class="chips" id="areaRow"><select id="area" title="Only spots in one area"></select></div>
    </div>
    <div class="filtmeta"><span id="count"></span><a href="#" id="reset">reset</a></div>
  </div>
  <div id="list"></div>
</div>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="cities/cities.js"></script>
<script>
  // The site is static (no build step), so a city is chosen from the URL
  // (?city=nyc, default nyc) and its three files are injected as script tags.
  // The map code below runs only after all three have loaded.
  const cityId = (() => {
    const want = new URLSearchParams(location.search).get('city');
    return CITIES.some(c => c.id === want) ? want : CITIES[0].id;
  })();
  const DEBUG = new URLSearchParams(location.search).get('debug') === '1';   // ?debug=1 turns on console notes
  const citySelect = document.getElementById('city');
  for (const c of CITIES) citySelect.add(new Option(c.name, c.id, false, c.id === cityId));
  citySelect.onchange = () => { const p = new URLSearchParams(location.search); p.set('city', citySelect.value); location.search = '?' + p; };

  // Filters live in the URL beside ?city= (&kind=pin,corridor&type=walkie-talkie)
  // so a filtered view is shareable and survives reload. Absent = everything on.
  const KINDS = ['neighborhood', 'park', 'corridor', 'landmark', 'pin'];
  const TYPES = [['visitor', 'visitor pick', 'var(--accent)'], ['favorite', 'personal favorite', 'var(--fav)'], ['walkie-talkie', 'Walkie Talkie', '#2d7dd2']];
  const readSet = (key, all) => {
    const v = (new URLSearchParams(location.search).get(key) || '').split(',').filter(x => all.includes(x));
    return new Set(v.length ? v : all);
  };
  const filter = { kind: readSet('kind', KINDS), type: readSet('type', TYPES.map(t => t[0])), area: new URLSearchParams(location.search).get('area') || '' };
  function syncUrl() {
    const p = new URLSearchParams(location.search);
    for (const [key, all] of [['kind', KINDS], ['type', TYPES.map(t => t[0])]]) {
      if (filter[key].size < all.length) p.set(key, all.filter(x => filter[key].has(x)).join(','));
      else p.delete(key);
    }
    if (filter.area) p.set('area', filter.area); else p.delete('area');
    history.replaceState(null, '', location.pathname + ([...p].length ? '?' + p : ''));
  }

  // Phone bottom sheet (the max-width media query in the CSS). Three stops;
  // the handle drags between them and a tap on it steps to the next one.
  // Tapping a spot or the bare map drops the sheet so the map is in view.
  const sheet = document.getElementById('sidebar'), handle = document.getElementById('handle');
  const phone = matchMedia('(max-width: 699px)');
  const SHEET_COLLAPSED = 120;   // px, matches the CSS
  const NEXT_STOP = { collapsed: 'half', half: 'full', full: 'collapsed' };
  function setSheet(stop) {
    sheet.dataset.sheet = stop;
    if (stop === 'collapsed') sheet.scrollTop = 0;   // show the title and chips, not mid-list
  }
  setSheet('collapsed');
  // The handle and the title are both drag surfaces (phones only: on desktop
  // the title is plain text and the handle is hidden).
  let drag = null;
  function dragSheet(el) {
    el.onpointerdown = e => {
      if (!phone.matches) return;
      drag = { y: e.clientY, h: sheet.offsetHeight, moved: false };
      el.setPointerCapture(e.pointerId);
      sheet.classList.add('dragging');
    };
    el.onpointermove = e => {
      if (!drag) return;
      const dy = drag.y - e.clientY;
      if (Math.abs(dy) > 6) drag.moved = true;
      sheet.style.height = Math.min(innerHeight, Math.max(SHEET_COLLAPSED, drag.h + dy)) + 'px';
    };
    el.onpointerup = el.onpointercancel = e => {
      if (!drag) return;
      const h = sheet.offsetHeight, half = innerHeight / 2, full = innerHeight - 48;
      sheet.classList.remove('dragging'); sheet.style.height = '';   // the CSS transition carries it the rest of the way
      if (e.type === 'pointerup' && !drag.moved) setSheet(NEXT_STOP[sheet.dataset.sheet]);   // a tap
      else setSheet(h < (SHEET_COLLAPSED + half) / 2 ? 'collapsed' : h < (half + full) / 2 ? 'half' : 'full');   // snap to the nearest stop
      drag = null;
    };
  }
  dragSheet(handle); dragSheet(document.getElementById('title'));
  handle.onclick = e => { if (e.detail === 0) setSheet(NEXT_STOP[sheet.dataset.sheet]); };   // keyboard only; taps are handled above
  // Keyboard focus landing in the part of the sheet that is clipped while it
  // is collapsed would scroll the header out of view, so open the sheet instead.
  sheet.addEventListener('focusin', e => {
    if (phone.matches && sheet.dataset.sheet === 'collapsed' && !e.target.closest('.handle, #title, .cityrow, .filters')) setSheet('half');
  });

  const loadScript = src => new Promise((ok, fail) => {
    const el = document.createElement('script');
    el.src = src; el.onload = ok; el.onerror = () => fail(new Error('failed to load ' + src));
    document.head.appendChild(el);
  });
  (async () => {
    for (const f of ['config.js', 'data.js', 'boundaries.js']) await loadScript(`cities/${cityId}/${f}`);
    document.title = CITY.pageTitle;
    document.getElementById('title').textContent = CITY.title;
    document.getElementById('intro').innerHTML = CITY.intro;
    init();
  })().catch(e => { document.getElementById('intro').textContent = e.message; console.error(e); });

  function init() {
  const map = L.map('map').setView(CITY.center, CITY.zoom);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors', maxZoom: 19,
    className: 'dimmed-tiles'
  }).addTo(map);
  // A tap on the bare map, or any popup opening (a tap on a shape or a dot),
  // drops the phone sheet so the map is in view.
  map.on('click popupopen', () => { if (phone.matches) setSheet('collapsed'); });

  // Join mentions onto their spots. Mention count is derived here, not stored.
  // (A spot's data field `area` is its borough/region; its map layer is `shape`.)
  const sourceById = new Map(SOURCES.map(s => [s.id, s]));
  const spots = SPOTS.map(s => ({ ...s, mentions: MENTIONS.filter(m => m.spotId === s.id) }))
    .filter(s => s.mentions.length > 0)
    .sort((a, b) => b.mentions.length - a.mentions.length);

  const fmtTime = t => `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`;

  // Pins are exact spots someone named on camera; they stay visible at every
  // zoom and draw above everything else.
  map.createPane('pins').style.zIndex = 650;

  // Landmark dots live in a cluster group: dots that would overlap collapse
  // into one bubble showing how many spots are inside; zoom in or click to
  // split them. Below MARKER_MIN_ZOOM the group is off the map and the heat
  // layer carries the wide view on its own. Pins, areas and corridors are
  // never clustered.
  const MARKER_MIN_ZOOM = 11;
  // Dots cluster when their centers are within CLUSTER_RADIUS px. The biggest
  // dot has a 12px radius, so two of them touch at 24px apart: 28 means
  // "cluster when they would touch". The plugin's default of 80 would fold
  // dots that sit visibly apart at zoom 12.
  const CLUSTER_RADIUS = 28;
  const CLUSTER_SIZE = n => n >= 7 ? ['l', 44] : n >= 4 ? ['m', 36] : ['s', 28];
  const markers = L.markerClusterGroup({
    maxClusterRadius: CLUSTER_RADIUS,
    disableClusteringAtZoom: 15,
    spiderfyOnMaxZoom: true,
    showCoverageOnHover: false,
    spiderLegPolylineOptions: { weight: 1.5, color: '#f5a623', opacity: 0.6 },
    iconCreateFunction: cluster => {
      const [size, px] = CLUSTER_SIZE(cluster.getChildCount());
      return L.divIcon({ html: String(cluster.getChildCount()), className: `cluster cluster-${size}`, iconSize: [px, px] });
    },
  });
  function syncMarkers() {
    if (map.getZoom() >= MARKER_MIN_ZOOM) markers.addTo(map);
    else map.removeLayer(markers);
  }
  map.on('zoomend', syncMarkers);

  // Color steps up with mention count; areas and corridors replace the heat blob.
  const heatColor = n => n >= 3 ? '#c8102e' : n === 2 ? '#e05c5c' : '#f5a623';
  const areaStyle = n => ({
    color: heatColor(n), fillColor: heatColor(n),
    fillOpacity: 0.18 + Math.min(n, 4) * 0.08, weight: 1.5, opacity: 0.9,
  });
  const corridorStyle = n => ({
    color: heatColor(n), weight: 7 + Math.min(n, 4) * 2, opacity: 0.8, lineCap: 'round', lineJoin: 'round',
  });

  for (const g of spots) {
    // Rows from Paulie B's own episodes say "Walkie Talkie"; rows from any other channel
    // (same kind of evidence, e.g. Philly) name that channel instead.
    const series = m => { const ch = sourceById.get(m.sourceId).channel; return !ch || ch === 'Paulie B' ? 'Walkie Talkie' : ch; };
    const label = m => m.type === 'favorite' ? 'personal favorite'
                     : m.type === 'walkie-talkie' ? (m.basis === 'haunt' ? 'regular spot · ' : 'shot here · ') + series(m)
                     : 'visitor pick';
    const html = `<div class="popup"><h3>${g.name}${g.kind === 'pin' ? ' <span class="pin-tag">exact spot</span>' : ''}</h3>` + g.mentions.map(m =>
      `<div class="m ${m.type === 'favorite' ? 'fav' : m.type === 'walkie-talkie' ? 'wt' : ''}">
         <span class="w">${m.speaker}</span> <span class="n">(${label(m)})</span><br>
         <span class="n">${m.quote}</span><br>
         <a href="${sourceById.get(m.sourceId).url}&t=${m.timestamp}s" target="_blank" rel="noopener">▶ watch at ${fmtTime(m.timestamp)}</a>
       </div>`).join('') + '</div>';

    if (g.kind === 'pin') {
      g.marker = L.circleMarker([g.lat, g.lng], {
        pane: 'pins', radius: 6, color: '#ffffff', weight: 2.5, fillColor: '#c8102e', fillOpacity: 1,
      }).addTo(map).bindPopup(html, { maxWidth: 300 });
      continue;
    }
    const boundary = BOUNDARIES[g.id];
    if (boundary) {
      g.isLine = boundary.geometry.type === 'LineString';
      g.shape = L.geoJSON(boundary.geometry, { style: (g.isLine ? corridorStyle : areaStyle)(g.mentions.length) })
        .bindPopup(html, { maxWidth: 300 }).addTo(map);
      continue;
    }
    if (g.kind !== 'landmark' && DEBUG) {
      console.info(`[yt-heatmap] no boundary for ${g.kind} "${g.id}" — rendering as a dot`);
    }
    // Size and color come from the counted mentions, so applyFilters sets them
    // and adds the dot to the cluster group.
    g.marker = L.circleMarker([g.lat, g.lng], { fillOpacity: 0.75, weight: 1.5 }).bindPopup(html, { maxWidth: 300 });
  }
  syncMarkers();

  // Stacking order decides what a click hits. Draw the largest areas first
  // (bottom), smaller areas above them, and corridors above every area, so an
  // overlapped small spot is still clickable. Re-run after every filter change,
  // because re-adding a hidden layer would put it on top.
  const bboxArea = layer => { const b = layer.getBounds(); return (b.getEast() - b.getWest()) * (b.getNorth() - b.getSouth()); };
  function restack() {
    const shaped = spots.filter(s => s.shape && s.visible);
    shaped.filter(s => !s.isLine).sort((a, b) => bboxArea(b.shape) - bboxArea(a.shape)).forEach(s => s.shape.bringToFront());
    shaped.filter(s => s.isLine).forEach(s => s.shape.bringToFront());
  }

  // Heat radius is in screen pixels, so halve it for every zoom level below
  // the baseline to keep blobs tied to a real-world area when zoomed out.
  // Growth when zooming in is capped at one level: past ~90px the canvas
  // shadow blur breaks up into square tiles.
  const BASE_ZOOM = 12, BASE_RADIUS = 45, BASE_BLUR = 30, HEAT_MAX_ZOOM = 14;
  function heatOpts() {
    const scale = Math.pow(2, Math.min(map.getZoom() - BASE_ZOOM, 1));
    return { radius: Math.max(10, BASE_RADIUS * scale),
             blur: Math.max(8, BASE_BLUR * scale) };
  }
  // Above HEAT_MAX_ZOOM the dots and areas already tell the story, so the
  // heat canvas fades out rather than smearing over individual blocks.
  function syncHeatVisibility(heat) {
    heat._canvas.style.transition = 'opacity .3s';
    heat._canvas.style.opacity = map.getZoom() > HEAT_MAX_ZOOM ? '0' : '1';
  }

  // The heat canvas throws if the map hasn't been laid out yet, so retry
  // until it succeeds instead of adding it unconditionally. heatPoints is
  // rebuilt by applyFilters, which also refreshes the layer once it exists.
  let heat = null, heatPoints = [];
  function addHeat() {
    try {
      map.invalidateSize();
      if (map.getSize().x === 0) throw new Error('map not laid out yet');
      heat = L.heatLayer(heatPoints, { ...heatOpts(), maxZoom: 13, max: 8,
        gradient: {0.2:'#1a3a6b', 0.4:'#2d7dd2', 0.6:'#f5a623', 0.85:'#e05c5c', 1:'#c8102e'} }).addTo(map);
      map.on('zoomend', () => { heat.setOptions(heatOpts()); syncHeatVisibility(heat); });
      syncHeatVisibility(heat);
    } catch (e) {
      setTimeout(addHeat, 250);
    }
  }

  // Sidebar list: one row per spot, built once. applyFilters shows, hides,
  // reorders and recounts the rows.
  const list = document.getElementById('list');
  let pendingShow = null;
  for (const g of spots) {
    const div = document.createElement('div');
    div.className = 'spot';
    div.innerHTML = `<div class="name">${g.kind === 'pin' ? '<span class="pin-glyph"></span>' : ''}${g.name} <span class="count"></span></div>
                     <div class="whos"></div>`;
    div.onclick = () => {
      if (phone.matches) setSheet('collapsed');
      // Fly to the spot and open its popup once the move settles, so Leaflet's
      // auto-pan (which nudges the map to keep a popup on screen) measures the
      // finished view rather than a frame of the animation. A click on another
      // row before then cancels this one.
      if (pendingShow) map.off('moveend', pendingShow);
      pendingShow = () => {
        pendingShow = null;
        if (g.shape || g.kind === 'pin') { (g.shape || g.marker).openPopup(); return; }
        // A landmark dot may have been off the map (below MARKER_MIN_ZOOM) or
        // folded into a cluster bubble. After the move it is usually its own
        // marker again, so open the popup directly; if it is still inside a
        // bubble at zoom 14, let the plugin split or spiderfy that bubble, but
        // only after its own split animation from the fly-to has finished, or
        // it loses track of the marker mid-animation. (zoomToShowLayer is not
        // called in the first case on purpose: its "already visible" path
        // ignores that animation and never fires.)
        if (map.hasLayer(g.marker)) { g.marker.openPopup(); return; }
        const split = () => markers.zoomToShowLayer(g.marker, () => g.marker.openPopup());
        if (markers._inZoomAnimation) markers.once('animationend', split); else split();
      };
      map.once('moveend', pendingShow);
      if (g.shape) map.fitBounds(g.shape.getBounds(), { maxZoom: 14, paddingBottomRight: [0, phone.matches ? SHEET_COLLAPSED : 0] });
      else map.setView([g.lat, g.lng], g.kind === 'pin' ? 16 : 14);
    };
    g.row = div;
    list.appendChild(div);
  }

  // Filters. A spot shows when its kind is on, it has at least one mention of
  // a type that is on, and it is in the chosen area (a spot with no area is
  // citywide and always passes). Its color, size, ×N and the names under it
  // use only the counted mentions; the popup still lists every mention. The
  // heat layer is rebuilt from the dots that remain.
  function applyFilters() {
    heatPoints = [];
    let shown = 0;
    for (const g of spots) {
      const counted = g.mentions.filter(m => filter.type.has(m.type));
      g.count = counted.length;
      g.visible = filter.kind.has(g.kind) && g.count > 0 && (!filter.area || !g.area || g.area === filter.area);
      if (g.visible) shown++;
      if (g.shape) {
        g.shape.setStyle((g.isLine ? corridorStyle : areaStyle)(g.count));
        if (g.visible) g.shape.addTo(map); else map.removeLayer(g.shape);
      } else if (g.kind === 'pin') {
        if (g.visible) g.marker.addTo(map); else map.removeLayer(g.marker);
      } else {
        const favOnly = counted.every(m => m.type === 'favorite');
        g.marker.setStyle({ radius: 6 + g.count * 2, color: favOnly ? '#e05c5c' : '#f5a623', fillColor: favOnly ? '#e05c5c' : '#f5a623' });
        // The cluster group queues adds while it is off the map, without
        // checking for duplicates, so track membership here.
        if (g.visible && !g.inCluster) markers.addLayer(g.marker);
        if (!g.visible && g.inCluster) markers.removeLayer(g.marker);
        g.inCluster = g.visible;
        if (g.visible) heatPoints.push([g.lat, g.lng, g.count]);
      }
      g.row.style.display = g.visible ? '' : 'none';
      g.row.querySelector('.count').textContent = '×' + g.count;
      g.row.querySelector('.whos').textContent = [...new Set(counted.map(m => m.speaker))].join(', ');
    }
    for (const g of spots.filter(g => g.visible).sort((a, b) => b.count - a.count)) list.appendChild(g.row);
    restack();
    if (heat) heat.setLatLngs(heatPoints);
    document.getElementById('count').textContent = `showing ${shown} of ${spots.length} spots`;
  }

  // Filter chips: one button per kind and per mention type; "reset" turns
  // everything back on.
  const repaintChips = [];
  function addChip(container, key, value, label, color) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.textContent = label;
    if (color) b.style.setProperty('--chip', color);
    const paint = () => b.setAttribute('aria-pressed', String(filter[key].has(value)));
    b.onclick = () => { if (filter[key].has(value)) filter[key].delete(value); else filter[key].add(value); paint(); applyFilters(); syncUrl(); };
    paint(); repaintChips.push(paint); container.appendChild(b);
  }
  for (const k of KINDS) addChip(document.getElementById('kindChips'), 'kind', k, k);
  for (const [t, label, color] of TYPES) addChip(document.getElementById('typeChips'), 'type', t, label, color);
  // Area dropdown (boroughs in NYC, regions in LA). Options come from the
  // data, most spots first; the row is hidden for a city whose spots carry
  // no area at all.
  const areaSel = document.getElementById('area');
  const areaCounts = new Map();
  for (const g of spots) if (g.area) areaCounts.set(g.area, (areaCounts.get(g.area) || 0) + 1);
  const areas = [...areaCounts.keys()].sort((a, b) => areaCounts.get(b) - areaCounts.get(a));
  if (!areas.includes(filter.area)) filter.area = '';
  if (areas.length) {
    areaSel.add(new Option('all ' + (CITY.areaLabel || 'area').toLowerCase() + 's', ''));
    for (const a of areas) areaSel.add(new Option(a, a, false, a === filter.area));
    areaSel.onchange = () => { filter.area = areaSel.value; applyFilters(); syncUrl(); };
  } else {
    document.getElementById('areaRow').style.display = 'none';
  }
  document.getElementById('reset').onclick = e => {
    e.preventDefault();
    filter.kind = new Set(KINDS); filter.type = new Set(TYPES.map(t => t[0])); filter.area = ''; areaSel.value = '';
    repaintChips.forEach(paint => paint()); applyFilters(); syncUrl();
  };

  applyFilters();
  addHeat();
  }
</script>
</body>
</html>
