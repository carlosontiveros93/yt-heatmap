<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Street Photography Heatmap</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<style>
  :root { --bg:#14161a; --panel:#1d2026; --text:#e8e6e1; --muted:#9a978f; --accent:#f5a623; --fav:#e05c5c; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); display:flex; height:100vh; }
  #sidebar { width:340px; min-width:280px; overflow-y:auto; background:var(--panel); padding:16px; border-right:1px solid #2c2f36; }
  #map { flex:1; }
  .cityrow { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--muted); margin:0 0 8px; }
  h1 { font-size:18px; margin:0 0 4px; }
  #city { font:12px -apple-system, "Segoe UI", sans-serif; color:var(--text); background:#23262d; border:1px solid #2c2f36; border-radius:6px; padding:2px 6px; height:22px; cursor:pointer; }
  .sub { font-size:12px; color:var(--muted); margin-bottom:12px; line-height:1.5; }
  .sub a { color:var(--accent); }
  .legend { font-size:12px; color:var(--muted); margin-bottom:12px; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:4px; vertical-align:middle; }
  .spot { padding:8px 10px; border-radius:8px; margin-bottom:6px; cursor:pointer; background:#23262d; }
  .spot:hover { background:#2b2f38; }
  .spot .name { font-weight:600; font-size:13px; }
  .spot .count { color:var(--accent); font-size:12px; }
  .spot .whos { color:var(--muted); font-size:11px; margin-top:2px; }
  .popup { font-size:13px; max-width:260px; }
  .popup h3 { margin:0 0 6px; font-size:14px; }
  .popup .m { margin:6px 0; padding:6px 8px; border-left:3px solid var(--accent); background:#f4f2ee; }
  .popup .m.fav { border-left-color:var(--fav); }
  .popup .m.wt { border-left-color:#2d7dd2; }
  .pin-tag { font-size:10px; font-weight:600; color:#c8102e; border:1px solid #c8102e; border-radius:3px; padding:0 4px; margin-left:6px; vertical-align:middle; }
  .spot .name .pin-glyph { display:inline-block; width:9px; height:9px; border-radius:50%; background:#c8102e; border:2px solid #fff; margin-right:5px; vertical-align:middle; }
  .popup .m .w { font-weight:600; }
  .popup .m .n { color:#555; }
  .popup a { color:#0a66c2; font-size:12px; }
  .leaflet-popup-content-wrapper { border-radius:8px; }
  .dimmed-tiles { filter: grayscale(60%) brightness(80%); }
  /* Cluster bubbles (Leaflet.markercluster). Only the plugin's animation CSS is
     loaded, not its green/yellow Default.css, so the look here is the whole style. */
  .cluster { display:flex; align-items:center; justify-content:center; border-radius:50%; background:var(--panel); border:2px solid var(--accent); color:#fff; font-weight:600; font-size:12px; box-shadow:0 1px 4px rgba(0,0,0,.45); }
  .cluster-m { font-size:13px; }
  .cluster-l { font-size:14px; }
  /* Filter chips: pressed = on (solid border in the chip's color), unpressed = off (dim, dashed). */
  .filters { margin-bottom:12px; }
  .chips { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:6px; }
  .chip { font:11px -apple-system, "Segoe UI", sans-serif; color:var(--text); background:#23262d; border:1px solid var(--chip, var(--accent)); border-radius:999px; padding:3px 9px; cursor:pointer; }
  .chip:hover { background:#2b2f38; }
  .chip[aria-pressed="false"] { color:var(--muted); background:transparent; border:1px dashed #3a3e47; }
  .filtmeta { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); }
  .filtmeta a { color:var(--accent); text-decoration:none; }
</style>
</head>
<body>
<div id="sidebar">
  <div class="cityrow">City <select id="city" title="Switch city"></select></div>
  <h1 id="title"></h1>
  <div class="sub" id="intro"></div>
  <div class="legend">
    <span class="dot" style="background:var(--accent)"></span>recommended for visitors&nbsp;&nbsp;
    <span class="dot" style="background:var(--fav)"></span>photographer's own favorite<br>
    <span class="dot" style="background:rgba(245,166,35,.45); border:1.5px solid var(--accent); border-radius:2px"></span>neighborhood / park area&nbsp;&nbsp;
    <span class="dot" style="background:var(--accent); width:14px; height:4px; border-radius:2px"></span>street / waterfront corridor&nbsp;&nbsp;
    <span class="dot" style="background:#c8102e; border:2px solid #fff; width:11px; height:11px"></span>exact spot someone named<br>
    <span style="color:var(--muted)">darker = more mentions</span>
  </div>
  <div class="filters">
    <div class="chips" id="kindChips" title="Kinds of spot to show"></div>
    <div class="chips" id="typeChips" title="Kinds of mention to count"></div>
    <div class="filtmeta"><span id="count"></span><a href="#" id="reset">reset</a></div>
  </div>
  <div id="list"></div>
</div>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="cities/cities.js"></script>
<script>
  // The site is static (no build step), so a city is chosen from the URL
  // (?city=nyc, default nyc) and its three files are injected as script tags.
  // The map code below runs only after all three have loaded.
  const cityId = (() => {
    const want = new URLSearchParams(location.search).get('city');
    return CITIES.some(c => c.id === want) ? want : CITIES[0].id;
  })();
  const citySelect = document.getElementById('city');
  for (const c of CITIES) citySelect.add(new Option(c.name, c.id, false, c.id === cityId));
  citySelect.onchange = () => { const p = new URLSearchParams(location.search); p.set('city', citySelect.value); location.search = '?' + p; };

  // Filters live in the URL beside ?city= (&kind=pin,corridor&type=walkie-talkie)
  // so a filtered view is shareable and survives reload. Absent = everything on.
  const KINDS = ['neighborhood', 'park', 'corridor', 'landmark', 'pin'];
  const TYPES = [['visitor', 'visitor pick', 'var(--accent)'], ['favorite', 'personal favorite', 'var(--fav)'], ['walkie-talkie', 'Walkie Talkie', '#2d7dd2']];
  const readSet = (key, all) => {
    const v = (new URLSearchParams(location.search).get(key) || '').split(',').filter(x => all.includes(x));
    return new Set(v.length ? v : all);
  };
  const filter = { kind: readSet('kind', KINDS), type: readSet('type', TYPES.map(t => t[0])) };
  function syncUrl() {
    const p = new URLSearchParams(location.search);
    for (const [key, all] of [['kind', KINDS], ['type', TYPES.map(t => t[0])]]) {
      if (filter[key].size < all.length) p.set(key, all.filter(x => filter[key].has(x)).join(','));
      else p.delete(key);
    }
    history.replaceState(null, '', location.pathname + ([...p].length ? '?' + p : ''));
  }

  const loadScript = src => new Promise((ok, fail) => {
    const el = document.createElement('script');
    el.src = src; el.onload = ok; el.onerror = () => fail(new Error('failed to load ' + src));
    document.head.appendChild(el);
  });
  (async () => {
    for (const f of ['config.js', 'data.js', 'boundaries.js']) await loadScript(`cities/${cityId}/${f}`);
    document.title = CITY.pageTitle;
    document.getElementById('title').textContent = CITY.title;
    document.getElementById('intro').innerHTML = CITY.intro;
    init();
  })().catch(e => { document.getElementById('intro').textContent = e.message; console.error(e); });

  function init() {
  const map = L.map('map').setView(CITY.center, CITY.zoom);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors', maxZoom: 19,
    className: 'dimmed-tiles'
  }).addTo(map);

  // Join mentions onto their spots. Mention count is derived here, not stored.
  const sourceById = new Map(SOURCES.map(s => [s.id, s]));
  const spots = SPOTS.map(s => ({ ...s, mentions: MENTIONS.filter(m => m.spotId === s.id) }))
    .filter(s => s.mentions.length > 0)
    .sort((a, b) => b.mentions.length - a.mentions.length);

  const fmtTime = t => `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`;

  // Pins are exact spots someone named on camera; they stay visible at every
  // zoom and draw above everything else.
  map.createPane('pins').style.zIndex = 650;

  // Landmark dots live in a cluster group: dots that would overlap collapse
  // into one bubble showing how many spots are inside; zoom in or click to
  // split them. Below MARKER_MIN_ZOOM the group is off the map and the heat
  // layer carries the wide view on its own. Pins, areas and corridors are
  // never clustered.
  const MARKER_MIN_ZOOM = 11;
  // Dots cluster when their centers are within CLUSTER_RADIUS px. The biggest
  // dot has a 12px radius, so two of them touch at 24px apart: 28 means
  // "cluster when they would touch". The plugin's default of 80 would fold
  // dots that sit visibly apart at zoom 12.
  const CLUSTER_RADIUS = 28;
  const CLUSTER_SIZE = n => n >= 7 ? ['l', 44] : n >= 4 ? ['m', 36] : ['s', 28];
  const markers = L.markerClusterGroup({
    maxClusterRadius: CLUSTER_RADIUS,
    disableClusteringAtZoom: 15,
    spiderfyOnMaxZoom: true,
    showCoverageOnHover: false,
    spiderLegPolylineOptions: { weight: 1.5, color: '#f5a623', opacity: 0.6 },
    iconCreateFunction: cluster => {
      const [size, px] = CLUSTER_SIZE(cluster.getChildCount());
      return L.divIcon({ html: String(cluster.getChildCount()), className: `cluster cluster-${size}`, iconSize: [px, px] });
    },
  });
  function syncMarkers() {
    if (map.getZoom() >= MARKER_MIN_ZOOM) markers.addTo(map);
    else map.removeLayer(markers);
  }
  map.on('zoomend', syncMarkers);

  // Color steps up with mention count; areas and corridors replace the heat blob.
  const heatColor = n => n >= 3 ? '#c8102e' : n === 2 ? '#e05c5c' : '#f5a623';
  const areaStyle = n => ({
    color: heatColor(n), fillColor: heatColor(n),
    fillOpacity: 0.18 + Math.min(n, 4) * 0.08, weight: 1.5, opacity: 0.9,
  });
  const corridorStyle = n => ({
    color: heatColor(n), weight: 7 + Math.min(n, 4) * 2, opacity: 0.8, lineCap: 'round', lineJoin: 'round',
  });

  for (const g of spots) {
    const label = m => m.type === 'favorite' ? 'personal favorite'
                     : m.type === 'walkie-talkie' ? (m.basis === 'haunt' ? 'regular spot · Walkie Talkie' : 'shot here · Walkie Talkie')
                     : 'visitor pick';
    const html = `<div class="popup"><h3>${g.name}${g.kind === 'pin' ? ' <span class="pin-tag">exact spot</span>' : ''}</h3>` + g.mentions.map(m =>
      `<div class="m ${m.type === 'favorite' ? 'fav' : m.type === 'walkie-talkie' ? 'wt' : ''}">
         <span class="w">${m.speaker}</span> <span class="n">(${label(m)})</span><br>
         <span class="n">${m.quote}</span><br>
         <a href="${sourceById.get(m.sourceId).url}&t=${m.timestamp}s" target="_blank">▶ watch at ${fmtTime(m.timestamp)}</a>
       </div>`).join('') + '</div>';

    if (g.kind === 'pin') {
      g.marker = L.circleMarker([g.lat, g.lng], {
        pane: 'pins', radius: 6, color: '#ffffff', weight: 2.5, fillColor: '#c8102e', fillOpacity: 1,
      }).addTo(map).bindPopup(html, { maxWidth: 300 });
      continue;
    }
    const boundary = BOUNDARIES[g.id];
    if (boundary) {
      g.isLine = boundary.geometry.type === 'LineString';
      g.area = L.geoJSON(boundary.geometry, { style: (g.isLine ? corridorStyle : areaStyle)(g.mentions.length) })
        .bindPopup(html, { maxWidth: 300 }).addTo(map);
      continue;
    }
    if (g.kind !== 'landmark') {
      console.info(`[yt-heatmap] no boundary for ${g.kind} "${g.id}" — rendering as a dot`);
    }
    // Size and color come from the counted mentions, so applyFilters sets them
    // and adds the dot to the cluster group.
    g.marker = L.circleMarker([g.lat, g.lng], { fillOpacity: 0.75, weight: 1.5 }).bindPopup(html, { maxWidth: 300 });
  }
  syncMarkers();

  // Stacking order decides what a click hits. Draw the largest areas first
  // (bottom), smaller areas above them, and corridors above every area, so an
  // overlapped small spot is still clickable. Re-run after every filter change,
  // because re-adding a hidden layer would put it on top.
  const bboxArea = layer => { const b = layer.getBounds(); return (b.getEast() - b.getWest()) * (b.getNorth() - b.getSouth()); };
  function restack() {
    const shaped = spots.filter(s => s.area && s.visible);
    shaped.filter(s => !s.isLine).sort((a, b) => bboxArea(b.area) - bboxArea(a.area)).forEach(s => s.area.bringToFront());
    shaped.filter(s => s.isLine).forEach(s => s.area.bringToFront());
  }

  // Heat radius is in screen pixels, so halve it for every zoom level below
  // the baseline to keep blobs tied to a real-world area when zoomed out.
  // Growth when zooming in is capped at one level: past ~90px the canvas
  // shadow blur breaks up into square tiles.
  const BASE_ZOOM = 12, BASE_RADIUS = 45, BASE_BLUR = 30, HEAT_MAX_ZOOM = 14;
  function heatOpts() {
    const scale = Math.pow(2, Math.min(map.getZoom() - BASE_ZOOM, 1));
    return { radius: Math.max(10, BASE_RADIUS * scale),
             blur: Math.max(8, BASE_BLUR * scale) };
  }
  // Above HEAT_MAX_ZOOM the dots and areas already tell the story, so the
  // heat canvas fades out rather than smearing over individual blocks.
  function syncHeatVisibility(heat) {
    heat._canvas.style.transition = 'opacity .3s';
    heat._canvas.style.opacity = map.getZoom() > HEAT_MAX_ZOOM ? '0' : '1';
  }

  // The heat canvas throws if the map hasn't been laid out yet, so retry
  // until it succeeds instead of adding it unconditionally. heatPoints is
  // rebuilt by applyFilters, which also refreshes the layer once it exists.
  let heat = null, heatPoints = [];
  function addHeat() {
    try {
      map.invalidateSize();
      if (map.getSize().x === 0) throw new Error('map not laid out yet');
      heat = L.heatLayer(heatPoints, { ...heatOpts(), maxZoom: 13, max: 8,
        gradient: {0.2:'#1a3a6b', 0.4:'#2d7dd2', 0.6:'#f5a623', 0.85:'#e05c5c', 1:'#c8102e'} }).addTo(map);
      map.on('zoomend', () => { heat.setOptions(heatOpts()); syncHeatVisibility(heat); });
      syncHeatVisibility(heat);
    } catch (e) {
      setTimeout(addHeat, 250);
    }
  }

  // Sidebar list: one row per spot, built once. applyFilters shows, hides,
  // reorders and recounts the rows.
  const list = document.getElementById('list');
  let pendingShow = null;
  for (const g of spots) {
    const div = document.createElement('div');
    div.className = 'spot';
    div.innerHTML = `<div class="name">${g.kind === 'pin' ? '<span class="pin-glyph"></span>' : ''}${g.name} <span class="count"></span></div>
                     <div class="whos"></div>`;
    div.onclick = () => {
      if (g.area) { map.fitBounds(g.area.getBounds(), { maxZoom: 14 }); g.area.openPopup(); }
      else if (g.kind === 'pin') { map.setView([g.lat, g.lng], 16); g.marker.openPopup(); }
      else {
        // A landmark dot may be off the map (below MARKER_MIN_ZOOM) or folded
        // into a cluster bubble. Fly to it first. Once the move settles the
        // dot is usually its own marker again, so open the popup directly; if
        // it is still inside a bubble, let the plugin split or spiderfy that
        // bubble. (zoomToShowLayer is not called in the first case on purpose:
        // its "already visible" path ignores the plugin's own split animation
        // and never fires.) A click on another row before then cancels this.
        if (pendingShow) map.off('moveend', pendingShow);
        pendingShow = () => {
          pendingShow = null;
          if (map.hasLayer(g.marker)) { g.marker.openPopup(); return; }
          // Still inside a bubble at zoom 14: let the plugin split or spiderfy
          // it, but only after its own split animation from the fly-to has
          // finished, or it loses track of the marker mid-animation.
          const split = () => markers.zoomToShowLayer(g.marker, () => g.marker.openPopup());
          if (markers._inZoomAnimation) markers.once('animationend', split); else split();
        };
        map.once('moveend', pendingShow);
        map.setView([g.lat, g.lng], 14);
      }
    };
    g.row = div;
    list.appendChild(div);
  }

  // Filters. A spot shows when its kind is on and it has at least one mention
  // of a type that is on. Its color, size, ×N and the names under it use only
  // those mentions; the popup still lists every mention. The heat layer is
  // rebuilt from the dots that remain.
  function applyFilters() {
    heatPoints = [];
    let shown = 0;
    for (const g of spots) {
      const counted = g.mentions.filter(m => filter.type.has(m.type));
      g.count = counted.length;
      g.visible = filter.kind.has(g.kind) && g.count > 0;
      if (g.visible) shown++;
      if (g.area) {
        g.area.setStyle((g.isLine ? corridorStyle : areaStyle)(g.count));
        if (g.visible) g.area.addTo(map); else map.removeLayer(g.area);
      } else if (g.kind === 'pin') {
        if (g.visible) g.marker.addTo(map); else map.removeLayer(g.marker);
      } else {
        const favOnly = counted.every(m => m.type === 'favorite');
        g.marker.setStyle({ radius: 6 + g.count * 2, color: favOnly ? '#e05c5c' : '#f5a623', fillColor: favOnly ? '#e05c5c' : '#f5a623' });
        // The cluster group queues adds while it is off the map, without
        // checking for duplicates, so track membership here.
        if (g.visible && !g.inCluster) markers.addLayer(g.marker);
        if (!g.visible && g.inCluster) markers.removeLayer(g.marker);
        g.inCluster = g.visible;
        if (g.visible) heatPoints.push([g.lat, g.lng, g.count]);
      }
      g.row.style.display = g.visible ? '' : 'none';
      g.row.querySelector('.count').textContent = '×' + g.count;
      g.row.querySelector('.whos').textContent = [...new Set(counted.map(m => m.speaker))].join(', ');
    }
    for (const g of spots.filter(g => g.visible).sort((a, b) => b.count - a.count)) list.appendChild(g.row);
    restack();
    if (heat) heat.setLatLngs(heatPoints);
    document.getElementById('count').textContent = `showing ${shown} of ${spots.length} spots`;
  }

  // Filter chips: one button per kind and per mention type; "reset" turns
  // everything back on.
  const repaintChips = [];
  function addChip(container, key, value, label, color) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.textContent = label;
    if (color) b.style.setProperty('--chip', color);
    const paint = () => b.setAttribute('aria-pressed', String(filter[key].has(value)));
    b.onclick = () => { if (filter[key].has(value)) filter[key].delete(value); else filter[key].add(value); paint(); applyFilters(); syncUrl(); };
    paint(); repaintChips.push(paint); container.appendChild(b);
  }
  for (const k of KINDS) addChip(document.getElementById('kindChips'), 'kind', k, k);
  for (const [t, label, color] of TYPES) addChip(document.getElementById('typeChips'), 'type', t, label, color);
  document.getElementById('reset').onclick = e => {
    e.preventDefault();
    filter.kind = new Set(KINDS); filter.type = new Set(TYPES.map(t => t[0]));
    repaintChips.forEach(paint => paint()); applyFilters(); syncUrl();
  };

  applyFilters();
  addHeat();
  }
</script>
</body>
</html>
